services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      - tm_data:/app/data
      - tm_generated:/app/generated
    restart: unless-stopped
  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    volumes:
      - tm_data:/app/data
      - tm_generated:/app/generated
    restart: unless-stopped
volumes:
  tm_data:
  tm_generated:
