name: Cloudflare Deploy
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployment credentials (without exposing values)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRENDMINT_SESSION_SECRET: ${{ secrets.TRENDMINT_SESSION_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ ${#TRENDMINT_SESSION_SECRET} -lt 32 ]; then
            echo 'Missing GitHub Actions secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, TRENDMINT_SESSION_SECRET (min 32 characters).'
            exit 1
          fi
      - name: Install dependencies
        working-directory: cloudflare
        run: npm install --no-audit --no-fund
      - name: Typecheck and automated tests
        working-directory: cloudflare
        run: npm run typecheck && npm test && node --test scripts/bootstrap-resources.test.mjs
      - name: Ensure dedicated D1 and R2 resources
        id: resources
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/bootstrap-resources.mjs
      - name: Apply database migrations
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ steps.resources.outputs.database_id }}
        run: npm run migrate:remote
      - name: Deploy standalone TrendMint Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ steps.resources.outputs.database_id }}
          TRENDMINT_CUSTOM_DOMAIN: ${{ vars.TRENDMINT_CUSTOM_DOMAIN }}
        run: npm run deploy
      - name: Configure persistent session signing secret
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ steps.resources.outputs.database_id }}
          TRENDMINT_SESSION_SECRET: ${{ secrets.TRENDMINT_SESSION_SECRET }}
          TRENDMINT_CUSTOM_DOMAIN: ${{ vars.TRENDMINT_CUSTOM_DOMAIN }}
        run: |
          node scripts/config.mjs
          printf '%s' "$TRENDMINT_SESSION_SECRET" | npx wrangler secret put SESSION_SECRET --config wrangler.generated.json
